<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>WCPSS Calendar (Traditional) 27-28</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f3f5f8;
    --surface: #ffffff;
    --surface-soft: #f8fafc;
    --ink: #172033;
    --muted: #64748b;
    --line: #dbe2ea;
    --brand: #16325c;
    --brand-2: #2457a6;
    --gold: #f2b544;
    --holiday-bg: #ffe3e2;
    --holiday-ink: #9f292c;
    --workday-bg: #e2eaff;
    --workday-ink: #29469c;
    --vacation-bg: #dff5e8;
    --vacation-ink: #17653e;
    --pull-bg: #fff0c7;
    --pull-ink: #8a4b08;
    --today: #0e9f6e;
    --shadow: 0 16px 42px rgb(28 43 67 / 9%);
    --day-size: 1rem;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-width: 320px;
    min-height: 100vh;
    padding: clamp(14px, 3vw, 42px);
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.45;
    transition: background-color .2s, color .2s;
  }

  button { font: inherit; }
  .page { width: min(1500px, 100%); margin: 0 auto; }
  .masthead { padding: 10px 0 4px; text-align: center; }
  h1 {
    margin: 0;
    color: var(--ink);
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    line-height: 1.1;
    letter-spacing: -.025em;
  }
  .toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
  .control,
  .size-control {
    min-height: 42px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--surface);
    color: var(--ink);
    box-shadow: 0 2px 8px rgb(28 43 67 / 5%);
  }
  .control { display: inline-flex; align-items: center; gap: 8px; padding: 0 13px; cursor: pointer; }
  .control:hover,
  .size-control button:hover { background: var(--surface-soft); }
  .control:focus-visible,
  .size-control button:focus-visible { outline: 2px solid var(--brand-2); outline-offset: 2px; }
  .control[aria-pressed="true"] { border-color: var(--brand-2); background: var(--brand-2); color: #fff; }
  .control-icon { width: 1.2em; font-size: 1.05rem; font-weight: 900; text-align: center; }
  .size-control { display: inline-flex; align-items: center; overflow: hidden; }
  .size-label { padding: 0 10px; color: var(--muted); font-size: .78rem; font-weight: 700; }
  .size-control button {
    width: 40px;
    align-self: stretch;
    border: 0;
    border-left: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    font-size: 1.1rem;
    font-weight: 800;
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    margin: 18px 0;
    padding: 14px 18px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    box-shadow: 0 6px 20px rgb(28 43 67 / 5%);
  }
  .legend-item { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: .8rem; font-weight: 650; }
  .legend-dot { width: 13px; height: 13px; flex: 0 0 13px; border-radius: 4px; }
  .legend-dot.today { border: 3px solid var(--today); border-radius: 50%; background: var(--surface); }
  .legend-dot.first-last { border: 3px solid var(--gold); border-radius: 50%; background: var(--surface); }
  .legend-dot.h { background: var(--holiday-bg); }
  .legend-dot.w { background: var(--workday-bg); }
  .legend-dot.v { background: var(--vacation-bg); }
  .legend-dot.pull { border: 2px dashed #dd8b18; background: var(--pull-bg); }
  .legend-dot.combo { border: 2px solid #dd8b18; background: transparent; }
  .legend-plan { display: none; }
  .plan-mode .legend-plan { display: inline-flex; }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 285px), 1fr));
    align-items: start;
    gap: clamp(12px, 2vw, 20px);
  }
  .month {
    min-width: 0;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--surface);
    box-shadow: 0 7px 24px rgb(28 43 67 / 6%);
    break-inside: avoid;
  }
  .month-header {
    margin: -16px -16px 14px;
    padding: 13px 16px 11px;
    border-bottom: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    background: var(--surface-soft);
    color: var(--brand);
    font-size: 1rem;
    font-weight: 850;
    letter-spacing: .01em;
  }
  .weekdays,
  .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .weekdays { margin-bottom: 5px; text-align: center; }
  .weekdays span { padding: 3px 0; color: var(--muted); font-size: .63rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
  .day {
    position: relative;
    display: grid;
    aspect-ratio: 1;
    place-items: center;
    min-width: 0;
    border: .5px solid var(--line);
    color: var(--ink);
    font-size: var(--day-size);
    font-style: normal;
    font-weight: 600;
    line-height: 1;
  }
  .day.empty { border-color: transparent; }
  .day.weekend { color: #9aa6b6; background: var(--surface-soft); }
  .day.no-school { color: #c5ccd5; }
  .day.h { background: var(--holiday-bg); color: var(--holiday-ink); font-weight: 800; }
  .day.w { background: var(--workday-bg); color: var(--workday-ink); font-weight: 800; }
  .day.v { background: var(--vacation-bg); color: var(--vacation-ink); font-weight: 800; }
  .day.pull { outline: 2px dashed #dd8b18; outline-offset: -3px; background: var(--pull-bg); color: var(--pull-ink); font-weight: 850; }
  .day.first-last,
  .day.today { z-index: 2; margin: 2px; border: 3px solid; border-radius: 50%; background: var(--surface); font-weight: 900; }
  .day.first-last { border-color: var(--gold); }
  .day.today { border-color: var(--today); }
  .day.today::before {
    content: "";
    position: absolute;
    inset: -3px;
    border: 3px solid var(--today);
    border-radius: 50%;
    opacity: .55;
    animation: pulse 1.7s ease-in-out infinite;
    pointer-events: none;
    will-change: transform, opacity;
  }
  /* transform + opacity only: compositor-animated, no per-frame repaint */
  @keyframes pulse { 50% { transform: scale(1.3); opacity: 0; } }

  .day[data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute;
    z-index: 20;
    bottom: calc(100% + 6px);
    left: 50%;
    width: max-content;
    max-width: 210px;
    padding: 6px 8px;
    border-radius: 6px;
    background: var(--ink);
    box-shadow: 0 5px 15px rgb(0 0 0 / 18%);
    color: var(--surface);
    font-size: .66rem;
    font-weight: 650;
    line-height: 1.3;
    text-align: center;
    transform: translateX(-50%);
    pointer-events: none;
  }

  .day.combo { z-index: 1; }
  .day.combo-top { border-top: 3px solid #dd8b18; }
  .day.combo-bottom { border-bottom: 3px solid #dd8b18; }
  .day.combo-left { border-left: 3px solid #dd8b18; }
  .day.combo-right { border-right: 3px solid #dd8b18; }
  body:not(.plan-mode) .day.pull { outline: 0; background: transparent; color: var(--ink); font-weight: 600; }
  body:not(.plan-mode) .day.combo-top { border-top-width: .5px; border-top-color: var(--line); }
  body:not(.plan-mode) .day.combo-bottom { border-bottom-width: .5px; border-bottom-color: var(--line); }
  body:not(.plan-mode) .day.combo-left { border-left-width: .5px; border-left-color: var(--line); }
  body:not(.plan-mode) .day.combo-right { border-right-width: .5px; border-right-color: var(--line); }

  .month-notes {
    display: flex;
    flex-wrap: wrap;
    gap: 5px 12px;
    margin: 12px 0 0;
    padding: 11px 0 0;
    border-top: 1px solid var(--line);
  }
  .month-notes li { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: .69rem; line-height: 1.25; }
  .dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 3px; }
  .dot.h { background: var(--holiday-bg); }
  .dot.w { background: var(--workday-bg); }
  .dot.v { background: var(--vacation-bg); }
  .dot.first-last { background: var(--gold); }

  body.dark {
    color-scheme: dark;
    --bg: #0c1220;
    --surface: #131c2c;
    --surface-soft: #182438;
    --ink: #edf3fb;
    --muted: #a7b3c5;
    --line: #2b3a50;
    --brand: #dce9ff;
    --holiday-bg: #6e292f;
    --holiday-ink: #ffd9db;
    --workday-bg: #263f7a;
    --workday-ink: #dce6ff;
    --vacation-bg: #18583c;
    --vacation-ink: #d9f8e7;
    --pull-bg: #68420e;
    --pull-ink: #ffedbd;
    --shadow: 0 18px 44px rgb(0 0 0 / 28%);
  }
  body.dark:not(.plan-mode) .day.pull { background: transparent; color: var(--ink); }

  @media (max-width: 600px) {
    body { padding: 10px; }
    .control { flex: 1 1 auto; justify-content: center; }
    .size-control { flex: 1 1 100%; justify-content: space-between; }
    .size-label { flex: 1; }
    .legend { margin-block: 10px; padding: 12px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
  @media print {
    @page { size: A4; margin: 8mm; }
    :root { --surface: #fff; --surface-soft: #fff; --ink: #000; --muted: #222; --line: #000; }
    body, body.dark { padding: 0; background: #fff; color: #000; print-color-adjust: exact; }
    .page { width: 100%; }
    .masthead { padding: 0; }
    .toolbar { display: none; }
    h1 { max-width: none; margin-bottom: 5px; color: #000; font-size: 1.15rem; text-align: center; }
    .legend { justify-content: center; gap: 5px 10px; margin: 0 0 7px; padding: 0; border: 0; box-shadow: none; }
    .legend-item { color: #000; font-size: .52rem; }
    .legend-dot { width: 9px; height: 9px; flex-basis: 9px; }
    .calendar-grid { grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .month { padding: 5px; border: 1px solid #777; border-radius: 3px; box-shadow: none; }
    .month-header { margin: -5px -5px 4px; padding: 3px; border-radius: 0; color: #000; font-size: .68rem; text-align: center; }
    .weekdays { margin: 0; }
    .weekdays span { color: #000; font-size: .43rem; }
    .days { border-top: 1px solid #000; border-left: 1px solid #000; }
    .day,
    .day.empty,
    .day.h,
    .day.w,
    .day.v,
    .day.pull,
    .day.first-last,
    .day.today,
    .day.combo-top,
    .day.combo-bottom,
    .day.combo-left,
    .day.combo-right,
    body:not(.plan-mode) .day.combo-top,
    body:not(.plan-mode) .day.combo-bottom,
    body:not(.plan-mode) .day.combo-left,
    body:not(.plan-mode) .day.combo-right {
      margin: 0;
      border: 0;
      border-right: 1px solid #000;
      border-bottom: 1px solid #000;
      border-radius: 0;
      outline: 0;
      box-shadow: none;
      color: #000;
      font-size: .62rem;
      animation: none;
    }
    .day.today::before { display: none; }
    .month-notes { gap: 1px 6px; margin-top: 3px; padding-top: 3px; border-color: #777; }
    .month-notes li { color: #000; font-size: .43rem; }
    .dot { width: 6px; height: 6px; flex-basis: 6px; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <h1 id="title"></h1>
    <div class="toolbar" aria-label="Calendar controls">
      <button class="control" id="vpToggle" type="button" aria-pressed="false" title="Show suggested days to take off">
        <span class="control-icon" aria-hidden="true">V</span><span>Plan breaks</span>
      </button>
      <button class="control" id="themeToggle" type="button" aria-pressed="false" title="Switch color theme">
        <span class="control-icon" aria-hidden="true">☾</span><span>Theme</span>
      </button>
      <div class="size-control" aria-label="Day number size">
        <span class="size-label">Day size</span>
        <button id="sizeDown" type="button" aria-label="Decrease day number size">−</button>
        <button id="sizeUp" type="button" aria-label="Increase day number size">+</button>
      </div>
      <button class="control" id="printBtn" type="button">
        <span class="control-icon" aria-hidden="true">↗</span><span>Print</span>
      </button>
    </div>
  </header>

  <aside class="legend" aria-label="Calendar key">
    <span class="legend-item"><span class="legend-dot today"></span>Today</span>
    <span class="legend-item"><span class="legend-dot first-last"></span>First / last day</span>
    <span class="legend-item"><span class="legend-dot h"></span>Holiday</span>
    <span class="legend-item"><span class="legend-dot w"></span>Teacher workday</span>
    <span class="legend-item"><span class="legend-dot v"></span>Vacation</span>
    <span class="legend-item legend-plan"><span class="legend-dot pull"></span>Pull day</span>
    <span class="legend-item legend-plan"><span class="legend-dot combo"></span>Vacation block</span>
  </aside>

  <main class="calendar-grid" id="calendar" aria-label="School year calendar"></main>
</div>

<script>
const CONFIG = {
  title: 'WCPSS Calendar (Traditional) 27-28',
  firstDay: '2027-08-23',
  lastDay: '2028-06-08',

  // Holidays (H) - MM/DD format, year auto-resolved from session
  holidays: {
    '09/06': 'Labor Day',
    '11/11': 'Veterans Day',
    '11/25': 'Thanksgiving',
    '11/26': 'Thanksgiving Break',
    '12/23': 'Winter Break',
    '12/24': 'Winter Break',
    '01/17': 'MLK Day',
    '04/14': 'Good Friday',
    '05/29': 'Memorial Day'
  },

  // Teacher Workdays (W)
  workdays: {
    '08/16': 'Workday',
    '08/17': 'Workday',
    '08/18': 'Workday',
    '08/19': 'Workday',
    '08/20': 'Workday',
    '08/31': 'Workday',
    '10/11': 'Workday',
    '11/03': 'Workday',
    '11/24': 'Workday',
    '12/21': 'Workday',
    '12/22': 'Workday',
    '01/18': 'Workday',
    '02/21': 'Workday',
    '03/06': 'Workday',
    '03/07': 'Workday',
    '04/03': 'Workday',
    '04/04': 'Workday',
    '04/17': 'Workday'
  },

  // Vacation Days (V)
  vacations: {
    '11/29': 'Thanksgiving Break',
    '12/27': 'Winter Break',
    '12/28': 'Winter Break',
    '12/29': 'Winter Break',
    '12/30': 'Winter Break',
    '12/31': 'Winter Break',
    '03/27': 'Spring Break',
    '03/28': 'Spring Break',
    '03/29': 'Spring Break',
    '03/30': 'Spring Break',
    '03/31': 'Spring Break'
  }
};

function resolveDate(mmdd) {
  const [m, d] = mmdd.split('/');
  const startYear = parseInt(CONFIG.firstDay.substring(0, 4));
  const startMonth = parseInt(CONFIG.firstDay.substring(5, 7));
  return `${parseInt(m) >= startMonth ? startYear : startYear + 1}-${m}-${d}`;
}

const daysOff = {};
Object.entries(CONFIG.holidays).forEach(([date, label]) => { daysOff[resolveDate(date)] = ['h', label]; });
Object.entries(CONFIG.workdays).forEach(([date, label]) => { daysOff[resolveDate(date)] = ['w', label]; });
Object.entries(CONFIG.vacations).forEach(([date, label]) => { daysOff[resolveDate(date)] = ['v', label]; });

const firstDay = CONFIG.firstDay;
const lastDay = CONFIG.lastDay;
const pad = number => number.toString().padStart(2, '0');
const dateStr = (year, month, day) => `${year}-${pad(month + 1)}-${pad(day)}`;
const getDow = date => new Date(date + 'T12:00:00').getDay();

function addDays(date, amount) {
  const result = new Date(date + 'T12:00:00');
  result.setDate(result.getDate() + amount);
  return `${result.getFullYear()}-${pad(result.getMonth() + 1)}-${pad(result.getDate())}`;
}

function isOff(date) {
  return [0, 6].includes(getDow(date)) || Boolean(daysOff[date]);
}

function generateCombos() {
  const pullDays = new Set();
  const comboRanges = [];
  const allDates = [];
  let current = firstDay;
  while (current <= lastDay) {
    allDates.push(current);
    current = addDays(current, 1);
  }

  const clusters = [];
  let cluster = [];
  allDates.forEach(date => {
    if (isOff(date)) cluster.push(date);
    else if (cluster.length) {
      clusters.push(cluster);
      cluster = [];
    }
  });
  if (cluster.length) clusters.push(cluster);

  clusters.forEach(days => {
    if (!days.some(date => daysOff[date])) return;

    const before = addDays(days[0], -1);
    const before2 = addDays(days[0], -2);
    const after = addDays(days.at(-1), 1);
    const after2 = addDays(days.at(-1), 2);
    let blockStart = days[0];
    let blockEnd = days.at(-1);
    const pulls = [];

    if (before >= firstDay && before <= lastDay && !isOff(before) && getDow(before) === 5) {
      pulls.push(before);
      blockStart = before;
      if (before2 >= firstDay && before2 <= lastDay && !isOff(before2) && getDow(before2) === 4 && daysOff[before]) {
        pulls.push(before2);
        blockStart = before2;
      }
    } else if (before >= firstDay && before <= lastDay && !isOff(before) && getDow(before) === 4 && daysOff[addDays(before, 1)]) {
      pulls.push(before);
      blockStart = before;
    }

    if (after >= firstDay && after <= lastDay && !isOff(after) && getDow(after) === 1) {
      pulls.push(after);
      blockEnd = after;
      if (after2 >= firstDay && after2 <= lastDay && !isOff(after2) && getDow(after2) === 2 && daysOff[after]) {
        pulls.push(after2);
        blockEnd = after2;
      }
    } else if (after >= firstDay && after <= lastDay && !isOff(after) && getDow(after) === 2 && daysOff[addDays(after, -1)]) {
      pulls.push(after);
      blockEnd = after;
    }

    let total = 0;
    for (let date = blockStart; date <= blockEnd; date = addDays(date, 1)) total++;
    if (pulls.length && total >= 4) {
      pulls.forEach(date => pullDays.add(date));
      comboRanges.push([blockStart, blockEnd]);
    }
  });

  return { pullDays, comboRanges };
}

const { pullDays, comboRanges } = generateCombos();
const inCombo = date => comboRanges.some(([start, end]) => date >= start && date <= end);

// Small runnable check for the vacation-planning invariant.
console.assert(
  [...pullDays].every(date => !isOff(date)) && comboRanges.every(([start, end]) => {
    let length = 0;
    for (let date = start; date <= end; date = addDays(date, 1)) length++;
    return length >= 4;
  }),
  'Vacation planner generated an invalid block'
);

const title = document.getElementById('title');
const calendar = document.getElementById('calendar');
const themeToggle = document.getElementById('themeToggle');
const vpToggle = document.getElementById('vpToggle');
title.textContent = CONFIG.title;
document.title = CONFIG.title;

if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
  document.body.classList.add('dark');
  themeToggle.setAttribute('aria-pressed', 'true');
}

vpToggle.addEventListener('click', () => {
  const active = vpToggle.getAttribute('aria-pressed') !== 'true';
  vpToggle.setAttribute('aria-pressed', String(active));
  document.body.classList.toggle('plan-mode', active);
});

themeToggle.addEventListener('click', () => {
  const active = !document.body.classList.contains('dark');
  document.body.classList.toggle('dark', active);
  themeToggle.setAttribute('aria-pressed', String(active));
});

document.getElementById('printBtn').addEventListener('click', () => window.print());

let daySizeLevel = 1;
const daySizes = [.8, 1, 1.3, 1.6, 2];
function adjustDaySize(amount) {
  daySizeLevel = Math.max(0, Math.min(daySizes.length - 1, daySizeLevel + amount));
  document.documentElement.style.setProperty('--day-size', `${daySizes[daySizeLevel]}rem`);
}
document.getElementById('sizeDown').addEventListener('click', () => adjustDaySize(-1));
document.getElementById('sizeUp').addEventListener('click', () => adjustDaySize(1));

const now = new Date();
const todayStr = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`;
const startYear = parseInt(firstDay.substring(0, 4));
const startMonth = parseInt(firstDay.substring(5, 7)) - 1;
const endYear = parseInt(lastDay.substring(0, 4));
const endMonth = parseInt(lastDay.substring(5, 7)) - 1;
const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const months = [];

let year = startYear;
let month = startMonth;
while (year < endYear || (year === endYear && month <= endMonth)) {
  months.push([year, month]);
  if (++month > 11) {
    month = 0;
    year++;
  }
}

months.forEach(([year, month]) => {
  const section = document.createElement('section');
  section.className = 'month';
  const monthId = `month-${year}-${month + 1}`;
  section.setAttribute('aria-labelledby', monthId);
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const startDow = new Date(year, month, 1).getDay();
  const notes = [];
  let html = `<h2 class="month-header" id="${monthId}">${monthNames[month]} ${year}</h2>`;
  html += '<div class="weekdays" aria-hidden="true"><span>Su</span><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span></div><div class="days">';

  for (let blank = 0; blank < startDow; blank++) html += '<span class="day empty" aria-hidden="true"></span>';

  for (let day = 1; day <= daysInMonth; day++) {
    const date = dateStr(year, month, day);
    const dow = new Date(year, month, day).getDay();
    let classes = 'day';

    if (date === firstDay || date === lastDay) {
      classes += ' first-last';
      notes.push({ start: day, end: day, label: date === firstDay ? 'First Day of School' : 'Last Day of School', type: 'first-last' });
    } else if (date === todayStr) classes += ' today';
    else if (pullDays.has(date)) classes += ' pull';
    else if (daysOff[date]) {
      const [type, label] = daysOff[date];
      classes += ` ${type}`;
      const previous = notes.at(-1);
      if (previous && previous.label === label) previous.end = day;
      else notes.push({ start: day, end: day, label, type });
    } else if ([0, 6].includes(dow)) classes += ' weekend';
    else if (date < firstDay || date > lastDay) classes += ' no-school';
    else classes += ' school';

    if (inCombo(date)) classes += ' combo';
    const daysFromNow = Math.round((new Date(date + 'T12:00:00') - new Date(todayStr + 'T12:00:00')) / 86400000);
    const distance = daysFromNow === 0 ? 'Today' : daysFromNow > 0 ? `${daysFromNow}d away` : `${-daysFromNow}d ago`;
    let tip = distance;
    if (date === firstDay) tip = `First Day of School - ${distance}`;
    else if (date === lastDay) tip = `Last Day of School - ${distance}`;
    else if (pullDays.has(date)) tip = `Pull Day - ${distance}`;
    else if (daysOff[date]) tip = `${daysOff[date][1]} - ${distance}`;
    const label = `${monthNames[month]} ${day}, ${year}: ${tip}`;
    html += `<time class="${classes}" datetime="${date}" data-tip="${tip}" title="${tip}" aria-label="${label}">${day}</time>`;
  }
  html += '</div>';

  if (notes.length) {
    html += '<ul class="month-notes">';
    notes.forEach(({ start, end, label, type }) => {
      html += `<li><span class="dot ${type}"></span>${start === end ? start : `${start}-${end}`}: ${label}</li>`;
    });
    html += '</ul>';
  }

  section.innerHTML = html;
  calendar.appendChild(section);
});

document.querySelectorAll('.month').forEach((monthElement, index) => {
  const [year, month] = months[index];
  const startDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  comboRanges.forEach(([start, end]) => {
    const comboDays = [];
    for (let day = 1; day <= daysInMonth; day++) {
      if (dateStr(year, month, day) >= start && dateStr(year, month, day) <= end) comboDays.push(day);
    }
    const comboSet = new Set(comboDays);
    comboDays.forEach(day => {
      const cellIndex = startDow + day - 1;
      const column = cellIndex % 7;
      const cell = monthElement.querySelectorAll('.day')[cellIndex];
      if (!comboSet.has(day - 7)) cell.classList.add('combo-top');
      if (!comboSet.has(day + 7)) cell.classList.add('combo-bottom');
      if (column === 0 || !comboSet.has(day - 1)) cell.classList.add('combo-left');
      if (column === 6 || !comboSet.has(day + 1)) cell.classList.add('combo-right');
    });
  });
});

const todayElement = document.querySelector('.day.today');
if (todayElement) todayElement.closest('.month').scrollIntoView({ behavior: 'smooth', block: 'center' });
</script>
